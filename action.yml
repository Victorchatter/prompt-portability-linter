name: 'prompt-portability-linter'
description: 'Lint prompts, tool definitions, and agent configs for vendor-locked features.'
author: 'Victor'
branding:
  icon: 'globe'
  color: 'blue'

inputs:
  prompts:
    description: 'Path to prompt file(s). Glob patterns are supported.'
    required: true
  tools:
    description: 'Path to tool definitions (JSON/YAML). Optional.'
    required: false
  config:
    description: 'Path to agent config (JSON/YAML). Optional.'
    required: false
  rules:
    description: 'Path to a custom rules.yaml catalog. Optional.'
    required: false
  format:
    description: 'Output format: text, json, or sarif.'
    required: false
    default: 'sarif'
  warn-only:
    description: 'Report blockers but do not fail the step.'
    required: false
    default: 'false'
  fail-on-blockers:
    description: 'Fail the step when any blocker is reported.'
    required: false
    default: 'true'

outputs:
  score:
    description: 'Portability score from 0 to 100.'
  findings-count:
    description: 'Number of blocker findings reported.'
  report-path:
    description: 'Path to the generated report file.'

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      shell: bash
      run: |
        if [ -z "${{ inputs.prompts }}" ]; then
          echo "error: input 'prompts' is required." >&2
          exit 2
        fi
        case "${{ inputs.format }}" in
          text|json|sarif) ;;
          *)
            echo "error: format must be one of text, json, or sarif." >&2
            exit 2
            ;;
        esac

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install prompt-portability-linter
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "${{ github.workspace }}"

    - name: Run prompt-portability-linter
      id: lint
      shell: bash
      run: |
        FORMAT="${{ inputs.format }}"
        case "$FORMAT" in
          sarif) EXT=sarif ;;
          json)  EXT=json ;;
          text)  EXT=txt ;;
        esac
        REPORT="${{ github.workspace }}/prompt-portability-linter-report.${EXT}"
        echo "report-path=${REPORT}" >> "$GITHUB_OUTPUT"

        # Expand globs safely with bash.
        set +f
        PROMPTS=( ${{ inputs.prompts }} )
        set -f

        if [ ${#PROMPTS[@]} -eq 0 ]; then
          echo "error: no prompt files matched '${{ inputs.prompts }}'." >&2
          exit 2
        fi

        # Build the common argument list.
        ARGS=(--score)
        for p in "${PROMPTS[@]}"; do
          ARGS+=(--prompt "$p")
        done
        if [ -n "${{ inputs.tools }}" ]; then
          ARGS+=(--tools "${{ inputs.tools }}")
        fi
        if [ -n "${{ inputs.config }}" ]; then
          ARGS+=(--config "${{ inputs.config }}")
        fi
        if [ -n "${{ inputs.rules }}" ]; then
          ARGS+=(--rules "${{ inputs.rules }}")
        fi
        if [ "${{ inputs.warn-only }}" = "true" ]; then
          ARGS+=(--warn-only)
        fi

        # Write the user-facing report in the requested format.
        REPORT_ARGS=("${ARGS[@]}")
        REPORT_ARGS+=(--format "$FORMAT")
        prompt-portability-linter "${REPORT_ARGS[@]}" > "$REPORT"
        EXIT_CODE=$?
        echo "prompt-portability-linter exited with code ${EXIT_CODE}"

        # Always run a JSON pass to extract the score and blocker count reliably.
        JSON_REPORT="${{ github.workspace }}/prompt-portability-linter-report.json"
        JSON_ARGS=("${ARGS[@]}")
        JSON_ARGS+=(--format json)
        prompt-portability-linter "${JSON_ARGS[@]}" > "$JSON_REPORT"
        COUNT=$(python -c "import sys,json; d=json.load(open(sys.argv[1])); print(d.get('blockers', len(d.get('findings', []))))" "$JSON_REPORT")
        SCORE=$(python -c "import sys,json; d=json.load(open(sys.argv[1])); print(d.get('score', -1))" "$JSON_REPORT")

        echo "findings-count=${COUNT}" >> "$GITHUB_OUTPUT"
        echo "score=${SCORE}" >> "$GITHUB_OUTPUT"
        echo "Findings: ${COUNT}"
        echo "Score: ${SCORE}"

        if [ "${{ inputs.fail-on-blockers }}" = "true" ] && [ "$COUNT" -gt 0 ]; then
          exit 1
        fi
        # If the tool errored with a usage/config problem (exit 2), propagate it.
        # Otherwise (exit 0 or exit 1 for blockers) we have already handled the
        # failure decision above, so return 0.
        if [ "$EXIT_CODE" -eq 2 ]; then
          exit 2
        fi
        exit 0
